html<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Scheduler</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            text-align: left;
            color: #555;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: border 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: 600;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: 500;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .icon {
            font-size: 3em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📞</div>
        <h1>AI Voice Scheduler</h1>
        <p class="subtitle">Schedule meetings with AI voice assistant</p>
        
        <div class="input-group">
            <label for="phone">Phone Number (with country code)</label>
            <input 
                type="tel" 
                id="phone" 
                placeholder="+1234567890" 
                value="+91"
            />
        </div>
        
        <button onclick="initiateCall()" id="callBtn">
            🎙️ Start Voice Call
        </button>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        // PASTE YOUR PRODUCTION WEBHOOK URL HERE
        const WEBHOOK_URL = 'PASTE_YOUR_PRODUCTION_WEBHOOK_URL_HERE';
        
        async function initiateCall() {
            const phone = document.getElementById('phone').value.trim();
            const status = document.getElementById('status');
            const btn = document.getElementById('callBtn');
            
            if (!phone || phone.length < 10) {
                showStatus('Please enter a valid phone number', 'error');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '📞 Calling...';
            
            showStatus('Initiating call...', 'info');
            
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone_number: phone })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    showStatus('✅ Call started! Answer your phone.', 'success');
                } else {
                    showStatus('❌ Failed. Try again.', 'error');
                    btn.disabled = false;
                    btn.textContent = '🎙️ Start Voice Call';
                }
            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'error');
                btn.disabled = false;
                btn.textContent = '🎙️ Start Voice Call';
            }
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }
        
        document.getElementById('phone').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') initiateCall();
        });
    </script>
</body>
</html>
